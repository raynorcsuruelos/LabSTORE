# WL Kit Finder: deploy as its own Netlify project with Base directory = kit-finder
[build]
  command = "npm run build"
  publish = "dist"
  # Skip builds when nothing inside kit-finder/ changed
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[dev]
  command = "npm run dev"
  targetPort = 3000

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
